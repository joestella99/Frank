name: Frank CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q desktop.py pose_pet.py pet_motion.py job_engine.py cloud_hunt.py sound.py
      - name: Test scoring and dog motion
        run: python -m unittest discover -s tests -v
